[project]
name = "fars"
version = "0.1.0"
description = "Funded Account Risk System — statistical risk-management research for funded trading account evaluations."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Ricardo Medina", email = "ricardo@fars.dev"}
]
readme = "README.md"

dependencies = [
    "arch==8.0.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
fars = "src.cli:main"
fars-projectx = "src.realtime.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "statistical: slow statistical acceptance tests (operating characteristics)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
