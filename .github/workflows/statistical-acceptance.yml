name: Statistical acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-10a:
    name: Phase 10A locked acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-acceptance.lock
      - name: Install locked acceptance environment
        run: |
          python -m pip install --require-hashes -r requirements-acceptance.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run deterministic prerequisite
        run: python -m pytest -m "not statistical"
      - name: Smoke-test installed CLI
        run: |
          fars --help
          python -m src.cli --help
      - name: Run Phase 10A statistical acceptance
        run: python -m pytest -m statistical
